{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<div class="login-wrap">
  <form method="post" class="card login-card">
    <div class="brand brand-lg"><span class="logo" aria-hidden="true">M</span><span>Delivery Hub</span></div>
    <h1>Iniciar sesión</h1>
    <p class="muted">Incidencias de Glovo, Uber Eats y Just Eat en un solo sitio.</p>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="username">Usuario</label>
    <input id="username" name="username" value="{{ username }}" autocomplete="username" required autofocus>
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" class="btn btn-primary btn-block">Entrar</button>
  </form>
</div>
{% endblock %}
